<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #3B2F6B 0%, #1F3A68 55%, #0F2236 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 32px;
    box-sizing: border-box;
  }
  img { width: 120px; height: 120px; flex: none; }
  h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; line-height: 1.15; }
  p { margin: 0 0 14px; font-size: 14px; line-height: 1.4; opacity: 0.85; }
  kbd {
    display: inline-block;
    min-width: 18px;
    padding: 3px 7px;
    margin-right: 2px;
    border-radius: 6px;
    background: #fff;
    color: #2B3445;
    font: 600 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    box-shadow: 0 2px 0 #C8CED8;
  }
  .keys { display: flex; gap: 10px; align-items: center; }
  .keys span { white-space: nowrap; }
</style>
</head>
<body>
  <img src="../docs/icon.svg" alt="">
  <div>
    <h1>Azure PR<br>Review Keys</h1>
    <p>Review Azure DevOps pull requests from the keyboard.</p>
    <div class="keys"><span><kbd>⌘</kbd><kbd>↓</kbd></span><span><kbd>⌘</kbd><kbd>↑</kbd></span><span><kbd>⌘</kbd><kbd>Enter</kbd></span></div>
  </div>
</body>
</html>
