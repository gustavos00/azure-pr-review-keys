<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2F6B"/>
      <stop offset="0.55" stop-color="#1F3A68"/>
      <stop offset="1" stop-color="#0F2236"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E7EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win"><rect width="1080" height="560" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="700" rx="22" fill="url(#wall)"/>

  <!-- browser window -->
  <g transform="translate(60 56)" filter="url(#shadow)">
    <g clip-path="url(#win)">
      <rect width="1080" height="560" fill="#F8F8F8"/>
      <!-- title bar -->
      <rect width="1080" height="44" fill="#E4E6EA"/>
      <circle cx="24" cy="22" r="7" fill="#FF5F57"/>
      <circle cx="46" cy="22" r="7" fill="#FEBC2E"/>
      <circle cx="68" cy="22" r="7" fill="#28C840"/>
      <rect x="300" y="11" width="480" height="22" rx="11" fill="#FFFFFF"/>
      <text x="540" y="27" text-anchor="middle" fill="#666" font-size="12">dev.azure.com/…/pullrequest/1234?_a=files</text>

      <!-- PR header -->
      <rect y="44" width="1080" height="64" fill="#FFFFFF"/>
      <text x="24" y="74" fill="#201F1E" font-size="17" font-weight="700">Add sign-in page</text>
      <text x="24" y="96" fill="#605E5C" font-size="12">Overview     <tspan fill="#0078D4" font-weight="700">Files</tspan>     Updates     Commits</text>
      <rect x="104" y="102" width="34" height="3" fill="#0078D4"/>

      <!-- file tree -->
      <rect y="108" width="270" height="452" fill="#F3F2F1"/>
      <g font-size="13" fill="#323130">
        <text x="20" y="140" font-weight="700">my-repo</text>
        <text x="34" y="172">▾ src</text>

        <text x="56" y="204">login.tsx</text>
        <rect x="226" y="192" width="16" height="16" rx="3" fill="#0078D4"/>
        <path d="M230 200 l3 3 l6 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <rect x="40" y="220" width="222" height="28" rx="4" fill="#DEECF9"/>
        <text x="56" y="239" font-weight="700">session.ts</text>
        <rect x="226" y="226" width="16" height="16" rx="3" fill="#fff" stroke="#8A8886" stroke-width="1.5"/>

        <text x="56" y="274">routes.ts</text>
        <rect x="226" y="262" width="16" height="16" rx="3" fill="#fff" stroke="#8A8886" stroke-width="1.5"/>

        <text x="34" y="308">▾ tests</text>
        <text x="56" y="340">session.test.ts</text>
        <rect x="226" y="328" width="16" height="16" rx="3" fill="#fff" stroke="#8A8886" stroke-width="1.5"/>
      </g>

      <!-- diff card -->
      <rect x="290" y="126" width="770" height="414" rx="6" fill="#FFFFFF" stroke="#E1DFDD"/>
      <text x="310" y="154" fill="#201F1E" font-size="14" font-weight="700">session.ts</text>
      <text x="390" y="154" fill="#605E5C" font-size="12">/src/session.ts</text>
      <line x1="290" y1="168" x2="1060" y2="168" stroke="#E1DFDD"/>
      <line x1="675" y1="168" x2="675" y2="540" stroke="#E1DFDD"/>

      <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#323130" xml:space="preserve">
        <!-- unchanged -->
        <text x="304" y="194" fill="#A19F9D">12</text><text x="336" y="194">export function readSession(</text>
        <text x="689" y="194" fill="#A19F9D">12</text><text x="721" y="194">export function readSession(</text>
        <text x="304" y="218" fill="#A19F9D">13</text><text x="336" y="218">  request: Request,</text>
        <text x="689" y="218" fill="#A19F9D">13</text><text x="721" y="218">  request: Request,</text>

        <!-- previous hunk (already seen) -->
        <rect x="291" y="228" width="384" height="24" fill="#FDE7E9"/>
        <rect x="676" y="228" width="383" height="24" fill="#DFF6DD"/>
        <text x="304" y="245" fill="#A19F9D">14</text><text x="336" y="245">) {</text>
        <text x="689" y="245" fill="#A19F9D">14</text><text x="721" y="245">): Session | null {</text>

        <text x="304" y="276" fill="#A19F9D">15</text><text x="336" y="276">  const cookie = getCookie(request);</text>
        <text x="689" y="276" fill="#A19F9D">15</text><text x="721" y="276">  const cookie = getCookie(request);</text>
        <text x="304" y="300" fill="#A19F9D">16</text>
        <text x="689" y="300" fill="#A19F9D">16</text>

        <!-- current hunk -->
        <rect x="291" y="312" width="384" height="72" fill="#FDE7E9"/>
        <rect x="676" y="312" width="383" height="72" fill="#DFF6DD"/>
        <rect x="291" y="312" width="5" height="72" fill="#0078D4"/>
        <text x="304" y="330" fill="#A19F9D">17</text><text x="336" y="330">  return JSON.parse(cookie);</text>
        <text x="689" y="330" fill="#A19F9D">17</text><text x="721" y="330">  if (cookie === undefined) {</text>
        <text x="689" y="354" fill="#A19F9D">18</text><text x="721" y="354">    return null;</text>
        <text x="689" y="378" fill="#A19F9D">19</text><text x="721" y="378">  }</text>

        <text x="304" y="408" fill="#A19F9D">18</text>
        <text x="689" y="408" fill="#A19F9D">20</text>
        <rect x="676" y="420" width="383" height="24" fill="#DFF6DD"/>
        <rect x="291" y="420" width="384" height="24" fill="#F3F2F1"/>
        <text x="689" y="437" fill="#A19F9D">21</text><text x="721" y="437">  return parseSession(cookie);</text>
        <text x="304" y="466" fill="#A19F9D">19</text><text x="336" y="466">}</text>
        <text x="689" y="466" fill="#A19F9D">22</text><text x="721" y="466">}</text>
      </g>
    </g>
  </g>

  <!-- keycaps -->
  <g transform="translate(860 470)" filter="url(#soft)">
    <rect width="96" height="96" rx="20" fill="url(#key)" stroke="#C8CED8" stroke-width="2"/>
    <text x="48" y="64" text-anchor="middle" fill="#2B3445" font-size="44" font-weight="600">⌘</text>
    <rect x="112" width="96" height="96" rx="20" fill="#2F6FEB"/>
    <path d="M160 26 v44 M142 52 l18 18 l18 -18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- toast -->
  <g transform="translate(390 600)" filter="url(#soft)">
    <rect width="320" height="44" rx="10" fill="#201F1E" fill-opacity="0.94"/>
    <text x="160" y="28" text-anchor="middle" fill="#fff" font-size="15">✓ Marcado. A seguir: routes.ts</text>
  </g>
</svg>
